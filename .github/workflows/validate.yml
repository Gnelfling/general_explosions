name: Validate converter and Lua sources
on:
  push:
  pull_request:
jobs:
  python-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install numpy
      - run: python -m py_compile tools/vdb_to_vtf.py
      - run: python -m unittest discover -s tests -v
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 parser
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Syntax check all Lua scripts
        run: find lua -type f -name '*.lua' -print0 | xargs -0 -n 1 luac5.1 -p
